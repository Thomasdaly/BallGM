name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_CLI_HOME: ${{ github.workspace }}/.dotnet
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build-and-test:
    name: Build and test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore BallGM.slnx

      - name: Check formatting
        run: dotnet format BallGM.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build BallGM.slnx --configuration Release --no-restore -p:UseSharedCompilation=false

      - name: Test
        run: dotnet test BallGM.slnx --configuration Release --no-build
